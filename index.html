  <style>

    /* =========================
       GLOBAL
    ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      text-decoration: none;
      color: #fff !important;
    }

    body {
      min-height: 100vh;
      padding: 20px 20px 40px 20px;
      margin-top: 90px; 
      font-family: 'Creepster', sans-serif;

      background:
        radial-gradient(
          circle at top left,
          rgba(56, 189, 248, 0.08),
          transparent 35%
        ),
        radial-gradient(
          circle at bottom right,
          rgba(14, 165, 233, 0.08),
          transparent 35%
        ),
        #0f172a;

      color: #f8fafc;
    }


    /* =========================
       SEARCH CONTAINER (FIXED)
    ========================= */

    .search-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 15px 20px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }


    /* =========================
       SEARCH INPUT
    ========================= */

    input {
      width: 100%;
      max-width: 550px;
      padding: 18px 25px;

      font-size: 20px; 
      font-family: 'Creepster', sans-serif !important; 
      font-weight: 450;

      /* User jo type karega uska color white */
      color: #ffffff !important; 

      background:
        linear-gradient(#1e293b, #1e293b) padding-box,
        linear-gradient(
          90deg,
          #334155,
          #38bdf8,
          #334155
        ) border-box;

      border: 2px solid transparent;
      border-radius: 50px;

      outline: none;

      transition: all 0.3s ease;

      box-shadow:
        0 4px 6px rgba(0, 0, 0, 0.3),
        inset 0 1px 1px rgba(255, 255, 255, 0.03);
    }


    input::placeholder {
      font-family: 'Creepster', sans-serif !important; 
      color: #94a3b8;
      transition: 0.3s ease;
    }


    input:focus {
      border-color: transparent;

      box-shadow:
        0 0 15px rgba(56, 189, 248, 0.35),
        0 8px 25px rgba(0, 0, 0, 0.35);
    }


    input:focus::placeholder {
      color: #64748b;
    }


    /* =========================
       PRODUCT LIST
    ========================= */

    .list {
      list-style: none;
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }


    /* =========================
       PRODUCT CARD
    ========================= */

    .items {
      position: relative;
      overflow: hidden;

      background:
        linear-gradient(
          145deg,
          rgba(30, 41, 59, 0.98),
          rgba(15, 23, 42, 0.98)
        );

      color: #f8fafc;
      padding: 24px 28px;
      border-radius: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #334155;

      box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.03);

      transform: translateY(0);

      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease,
        border-color 0.3s ease;
    }


    .items::before {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 80%;
      height: 100%;

      background: linear-gradient(
        90deg,
        transparent,
        rgba(56, 189, 248, 0.06),
        transparent
      );

      transform: skewX(-20deg);
      transition: 0.7s ease;
    }


    .items:hover::before {
      left: 130%;
    }


    .items:hover {
      transform: translateY(-6px);
      border-color: #38bdf8;
      box-shadow:
        0 15px 35px rgba(0, 0, 0, 0.6),
        0 0 20px rgba(56, 189, 248, 0.12);
    }


    /* =========================
       PRODUCT INFO
    ========================= */

    .product-info {
      position: relative;
      z-index: 2;
    }

    .product-info h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .product-info h2 {
      font-family: 'Poppins', sans-serif;
      font-size: 18px;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .product-info p {
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 700;
    }

  </style>
</head>

    let task = document.querySelector("#task")
    let list = document.querySelector(".list")

    task.addEventListener("input", () => {
      let user = task.value.trim().toLocaleLowerCase();
      if(user === ""){
        list.textContent = "";
        return;
      }
      let data = product.filter((curl) => {
        let name = curl.name.toLocaleLowerCase();
        let index = 0;
        for(let i = 0; i < name.length; i++){
          if(name[i] === user[index]){
            index++;
          }
        }
        return index === user.length;
      })

      list.textContent = "";
      
      data.forEach((curl) => {
        let li = document.createElement("section");
        li.innerHTML = `
        <div class="items">
          <a href="${curl.link}" target="_blank">
            <h1>product</h1>
            <h2>name: ${curl.name}</h2>
            <p>price: ₹${curl.price}</p>
          </a>
        </div>
        `
        list.append(li);
      })
    })
